<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Google+Sans+Text:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "lit": "https://cdn.jsdelivr.net/npm/lit@3.3.0/+esm",
      "@m3e/web/theme": "https://cdn.jsdelivr.net/npm/@m3e/web@2.0.2/dist/theme.js",
      "@m3e/web/form-field": "https://cdn.jsdelivr.net/npm/@m3e/web@2.0.2/dist/form-field.js",
      "@m3e/web/autocomplete": "https://cdn.jsdelivr.net/npm/@m3e/web@2.0.2/dist/autocomplete.js",
      "@m3e/web/option": "https://cdn.jsdelivr.net/npm/@m3e/web@2.0.2/dist/option.js",
      "@m3e/web/card": "https://cdn.jsdelivr.net/npm/@m3e/web@2.0.2/dist/card.js",
      "@m3e/web/button": "https://cdn.jsdelivr.net/npm/@m3e/web@2.0.2/dist/button.js",
      "@m3e/web/icon": "https://cdn.jsdelivr.net/npm/@m3e/web@2.0.2/dist/icon.js",
      "@m3e/web/core": "https://cdn.jsdelivr.net/npm/@m3e/web@2.0.2/dist/core.js",
      "@m3e/web/core/a11y": "https://cdn.jsdelivr.net/npm/@m3e/web@2.0.2/dist/core-a11y.js",
      "@m3e/web/core/anchoring": "https://cdn.jsdelivr.net/npm/@m3e/web@2.0.2/dist/core-anchoring.js",
      "@m3e/web/core/bidi": "https://cdn.jsdelivr.net/npm/@m3e/web@2.0.2/dist/core-bidi.js",
      "@m3e/web/core/layout": "https://cdn.jsdelivr.net/npm/@m3e/web@2.0.2/dist/core-layout.js",
      "@m3e/web/core/platform": "https://cdn.jsdelivr.net/npm/@m3e/web@2.0.2/dist/core-platform.js",
      "@m3e/core": "https://cdn.jsdelivr.net/npm/@m3e/web@2.0.2/dist/core.js"
    }
  }
  </script>
  <script type="module">
    import "@m3e/web/theme";
    import "@m3e/web/form-field";
    import "@m3e/web/autocomplete";
    import "@m3e/web/option";
    import "@m3e/web/card";
    import "@m3e/web/button";
    import "@m3e/web/icon";
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --m3e-theme-primary: #6750A4;
      --m3e-theme-on-primary: #FFFFFF;
      --m3e-theme-primary-container: #EADDFF;
      --m3e-theme-on-primary-container: #21005D;
      --m3e-theme-surface: #FEF7FF;
      --m3e-theme-on-surface: #1D1B20;
      --m3e-theme-surface-variant: #E7E0EC;
      --m3e-theme-on-surface-variant: #49454F;
      --m3e-theme-outline: #79747E;
      --m3e-theme-error: #BA1A1A;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --m3e-theme-primary: #D0BCFF;
        --m3e-theme-on-primary: #381E72;
        --m3e-theme-primary-container: #4F378B;
        --m3e-theme-on-primary-container: #EADDFF;
        --m3e-theme-surface: #141218;
        --m3e-theme-on-surface: #E6E0E9;
        --m3e-theme-surface-variant: #49454F;
        --m3e-theme-on-surface-variant: #CAC4D0;
        --m3e-theme-outline: #938F99;
        --m3e-theme-error: #FFB4AB;
      }
    }

    body {
      font-family: 'Google Sans Text', 'Google Sans', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, 
        var(--m3e-theme-surface) 0%, 
        var(--m3e-theme-surface-variant) 50%, 
        var(--m3e-theme-primary-container) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--m3e-theme-on-surface);
    }

    .container {
      width: 100%;
      max-width: 640px;
      text-align: center;
    }

    .hero {
      margin-bottom: 32px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .error-code {
      font-size: clamp(72px, 20vw, 140px);
      font-weight: 400;
      line-height: 1;
      background: linear-gradient(135deg, 
        var(--m3e-theme-primary) 0%, 
        var(--m3e-theme-on-surface-variant) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -4px;
    }

    .error-message {
      font-size: 20px;
      font-weight: 500;
      color: var(--m3e-theme-on-surface-variant);
      margin-bottom: 8px;
    }

    .error-path {
      font-family: 'Google Sans', monospace;
      font-size: 14px;
      color: var(--m3e-theme-outline);
      background: var(--m3e-theme-surface-variant);
      padding: 4px 12px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 32px;
    }

    .search-section {
      margin-bottom: 24px;
    }

    .search-container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 8px;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 8px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-family: inherit;
      border: 1px solid var(--m3e-theme-outline);
      border-radius: 4px;
      background: var(--m3e-theme-surface);
      color: var(--m3e-theme-on-surface);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper input:focus {
      border-color: var(--m3e-theme-primary);
      box-shadow: 0 0 0 2px var(--m3e-theme-primary-container);
    }

    .input-wrapper label {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--m3e-theme-on-surface-variant);
      pointer-events: none;
      transition: 0.2s;
      background: var(--m3e-theme-surface);
      padding: 0 4px;
    }

    .input-wrapper input:focus + label,
    .input-wrapper input:not(:placeholder-shown) + label {
      top: 0;
      font-size: 12px;
      color: var(--m3e-theme-primary);
    }

    m3e-autocomplete {
      width: 100%;
      --m3e-autocomplete-container-shape: 28px;
    }

    m3e-card {
      width: 100%;
      --m3e-card-container-shape: 16px;
    }

    .result-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      text-decoration: none;
      color: inherit;
      transition: background 0.2s;
    }

    .result-item:hover {
      background: var(--m3e-theme-surface-variant);
    }

    .result-icon {
      width: 40px;
      height: 40px;
      border-radius: 20px;
      background: var(--m3e-theme-primary-container);
      color: var(--m3e-theme-on-primary-container);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 16px;
      flex-shrink: 0;
    }

    .result-content {
      flex: 1;
      text-align: left;
      min-width: 0;
    }

    .result-shortcut {
      font-size: 16px;
      font-weight: 500;
      color: var(--m3e-theme-on-surface);
      font-family: 'Google Sans', monospace;
    }

    .result-url {
      font-size: 13px;
      color: var(--m3e-theme-on-surface-variant);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .results-container {
      max-height: 320px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--m3e-theme-outline) transparent;
    }

    .results-placeholder {
      color: var(--m3e-theme-on-surface-variant);
      font-size: 14px;
      padding: 24px;
    }

    .no-results {
      color: var(--m3e-theme-error);
      font-size: 14px;
      padding: 24px;
    }

    .shortcuts-section {
      margin-top: 24px;
    }

    .category-section {
      background: var(--m3e-theme-surface);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .category-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--m3e-theme-on-surface-variant);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .shortcuts-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .shortcut-chip {
      font-family: 'Google Sans', monospace;
      font-size: 13px;
      color: var(--m3e-theme-primary);
      background: var(--m3e-theme-primary-container);
      padding: 6px 12px;
      border-radius: 16px;
      text-decoration: none;
      transition: transform 0.2s;
    }

    .shortcut-chip:hover {
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 32px;
    }

    m3e-button {
      --m3e-button-container-shape: 20px;
    }
  </style>
</head>
<body>
  <m3e-theme>
  
  <div class="container">
    <div class="hero">
      <div class="error-code">404</div>
      <p class="error-message">This shortcut doesn't exist</p>
      <span class="error-path" id="requested-path">{{REQUESTED_PATH}}</span>
    </div>

    <div class="search-section">
      <p style="font-size: 14px; color: var(--m3e-theme-on-surface-variant); margin-bottom: 16px;">
        Search for a valid shortcut:
      </p>
      <m3e-card>
        <div class="search-container">
          <div class="input-wrapper">
            <input 
              id="shortcut-search" 
              type="text" 
              placeholder=" "
              autocomplete="off"
            >
            <label for="shortcut-search">Search shortcuts...</label>
          </div>
          <m3e-autocomplete 
            for="shortcut-search"
            leading-icon="search"
            strict
          >
            {{OPTIONS_HTML}}
          </m3e-autocomplete>
        </div>
      </m3e-card>
    </div>

    <div class="shortcuts-section" id="shortcuts-section">
      <p style="font-size: 14px; color: var(--m3e-theme-on-surface-variant); margin-bottom: 16px;">
        Or browse by category:
      </p>
      <div id="categories-container">
        {{CATEGORIES_HTML}}
      </div>
    </div>

    <div class="footer">
      <m3e-button variant="filled" shape="square" id="go-home">
        <m3e-icon slot="icon" name="home"></m3e-icon>
        Go Home
      </m3e-button>
    </div>
  </div>

  </m3e-theme>

  <script>
    const requestedPath = "{{REQUESTED_PATH}}";
    
    document.getElementById('requested-path').textContent = 'go/' + requestedPath;
    
    const searchInput = document.getElementById('shortcut-search');
    const autocomplete = document.querySelector('m3e-autocomplete[for="shortcut-search"]');

    autocomplete?.addEventListener('change', () => {
      const value = autocomplete.value || searchInput.value || '';
      let t = value.trim();
      if (t.toLowerCase().startsWith('go/')) t = t.slice(3);
      t = t.replace(/^\/+/, '');
      if (t) {
        window.location.href = '/' + t.split('/').map(encodeURIComponent).join('/');
      }
    });

    document.getElementById('go-home').addEventListener('click', () => {
      window.location.href = '/';
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
